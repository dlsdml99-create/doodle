name: Build Doodle APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          exec > >(tee /tmp/build.log) 2>&1
          set -x
          mkdir -p www icons scripts ~/.android
          cp index.html icon-*.png www/
          cp ic_launcher*.png splash.png icons/
          cp apply-icons.sh scripts/
          cp debug.keystore ~/.android/ || true
          npm pkg delete dependencies.@capacitor-community/text-to-speech
          npm install --no-audit --no-fund
          for v in 4 5 3; do npm i --no-audit --no-fund --legacy-peer-deps @capacitor-community/text-to-speech@$v && break; done
          npx cap add android
          bash scripts/apply-icons.sh
          npx cap sync android
          VER=$(grep -oE 'class="ver">v[0-9.]+' index.html | grep -oE 'v[0-9.]+')
          echo "VER=$VER" >> $GITHUB_ENV
          cd android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER#v}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Doodle.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: Doodle ${{ env.VER }}
          body_path: release-notes.md
          files: Doodle.apk
          make_latest: true
      - name: Error
        if: failure()
        env:
          T: ${{ github.token }}
        run: |
          [ -f /tmp/build.log ] || echo "SETUP STEP FAILED" > /tmp/build.log
          echo "::error title=ERROR::$(grep -v '^+' /tmp/build.log | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          mkdir /tmp/lg && cp /tmp/build.log /tmp/lg/ && cd /tmp/lg
          git init -q -b build-log && git add . && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -qf https://x-access-token:$T@github.com/${{ github.repository }} build-log
