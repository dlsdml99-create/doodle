name: Build Doodle APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        env:
          SIGNING: ${{ secrets.DOODLE_SIGNING }}
        run: |
          if [ -z "$SIGNING" ]; then echo "::error::서명 키 비밀값(DOODLE_SIGNING)이 없어요. 저장소 Settings → Secrets and variables → Actions 에 넣어 주세요."; exit 1; fi
          # 보안: 키 비밀번호가 혹시라도 로그에 찍히면 *** 로 가려지게
          echo "::add-mask::${SIGNING%%:*}"
          exec > >(tee /tmp/build.log) 2>&1
          mkdir -p www icons scripts ~/.android
          cp index.html icon-*.png www/
          # 글꼴을 woff2로 바꿔 용량 줄이기 (실패하면 원래 woff 그대로 씀)
          pip install -q fonttools==4.55.3 brotli==1.1.0 && python3 -c "
          from fontTools.ttLib import TTFont
          for n in ['gaegu-700','gowun-400']:
              f=TTFont('fonts/'+n+'.woff'); f.flavor='woff2'; f.save('fonts/'+n+'.woff2')
          " && ls -l fonts || echo "woff2 변환 실패: woff 사용"
          mkdir -p www/fonts
          if ls fonts/*.woff2 >/dev/null 2>&1; then cp fonts/*.woff2 www/fonts/; else cp fonts/*.woff www/fonts/; fi
          cp fonts/OFL-*.txt www/fonts/
          cp ic_launcher*.png splash.png icons/
          cp apply-icons.sh harden-android.sh scripts/
          # 보안: 부품 버전을 package.json에 고정하고, 설치할 때 남의 스크립트가 실행되지 않게 막음(--ignore-scripts)
          # package-lock.json 으로 매번 같은 부품 버전을 씀 (npm ci). .npmrc: legacy-peer-deps, ignore-scripts
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund --ignore-scripts
          else npm install --no-audit --no-fund --ignore-scripts; mkdir -p /tmp/lock && cp package-lock.json /tmp/lock/; echo NEW_LOCK=1 >> $GITHUB_ENV; echo "LOCKB64:$(gzip -9c package-lock.json | base64 -w0)"; fi
          npm ls --depth=0 || true
          npx cap add android
          bash scripts/harden-android.sh
          bash scripts/apply-icons.sh
          npx cap sync android
          VER=$(grep -oE 'class="ver">v[0-9.]+' index.html | grep -oE 'v[0-9.]+')
          echo "VER=$VER" >> $GITHUB_ENV
          cd android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER#v}\"/" app/build.gradle
          chmod +x gradlew
          sed -i 's/minifyEnabled false/minifyEnabled true\n            shrinkResources true/' app/build.gradle
          cat ../proguard-doodle.pro >> app/proguard-rules.pro
          KS="$RUNNER_TEMP/doodle.jks"; KA=doodle; KP="${SIGNING%%:*}"
          echo "${SIGNING#*:}" | base64 -d > "$KS"; echo "signing: release key (secret)"
          { echo "android.injected.signing.store.file=$KS"; echo "android.injected.signing.store.password=$KP"
            echo "android.injected.signing.key.alias=$KA"; echo "android.injected.signing.key.password=$KP"; } >> gradle.properties
          if ! ./gradlew assembleRelease --no-daemon; then
            echo "minify failed, retrying without it"
            sed -i 's/minifyEnabled true/minifyEnabled false/; s/shrinkResources true/shrinkResources false/' app/build.gradle
            ./gradlew assembleRelease --no-daemon
          fi
          # 보안: 서명 키 파일과 비밀번호 줄은 빌드가 끝나면 바로 지움
          rm -f "$KS"; sed -i '/android.injected.signing/d' gradle.properties
          cp app/build/outputs/apk/release/app-release.apk ../Doodle.apk
          ls -l ../Doodle.apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VER }}
          name: Doodle ${{ env.VER }}
          body_path: release-notes.md
          files: Doodle.apk
          make_latest: true
      - name: Site
        env:
          T: ${{ github.token }}
        run: |
          MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s Doodle.apk)/1048576}")
          pip install -q qrcode || true
          python3 -c "import qrcode,qrcode.image.svg as s;qrcode.make('https://dlsdml99-create.github.io/doodle/dl.html',image_factory=s.SvgPathImage,border=1).save('site/qr.svg')" || true
          sed -i "s/__VER__/$VER/g; s/__MB__/$MB/g" site/*.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://github.com/dlsdml99-create/doodle/releases/latest/download/Doodle.apk"><title>Doodle 받기</title><a href="https://github.com/dlsdml99-create/doodle/releases/latest/download/Doodle.apk">Doodle.apk 받기</a>' > site/dl.html
          touch site/.nojekyll
          bash webapp/build.sh "$VER-${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      # 처음 한 번: 저장소에 package-lock.json 이 없으면 만든 파일을 내려받을 수 있게 올려 둠 (비밀값 없음)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.NEW_LOCK == '1'
        with:
          name: package-lock
          path: /tmp/lock/package-lock.json
          retention-days: 3
          if-no-files-found: ignore
      # 실패하면 마지막 로그 몇 줄만 이 실행 화면에 보여 줌 (공개 브랜치에 올리지 않음, 비밀값은 *** 로 가려짐)
      - name: Error
        if: failure()
        run: |
          [ -f /tmp/build.log ] || echo "SETUP STEP FAILED" > /tmp/build.log
          echo "::error title=ERROR::$(grep -v '^+' /tmp/build.log | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
