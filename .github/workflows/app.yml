name: Build Doodle APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          exec > >(tee /tmp/build.log) 2>&1
          mkdir -p www icons scripts ~/.android
          cp index.html icon-*.png www/
          cp -r fonts www/
          cp ic_launcher*.png splash.png icons/
          cp apply-icons.sh scripts/
          cp debug.keystore ~/.android/ || true
          npm pkg delete dependencies.@capacitor-community/text-to-speech
          npm install --no-audit --no-fund
          for v in 4 5 3; do npm i --no-audit --no-fund --legacy-peer-deps @capacitor-community/text-to-speech@$v && break; done
          npx cap add android
          bash scripts/apply-icons.sh
          npx cap sync android
          VER=$(grep -oE 'class="ver">v[0-9.]+' index.html | grep -oE 'v[0-9.]+')
          echo "VER=$VER" >> $GITHUB_ENV
          cd android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER#v}\"/" app/build.gradle
          chmod +x gradlew
          sed -i 's/minifyEnabled false/minifyEnabled true\n            shrinkResources true/' app/build.gradle
          cat ../proguard-doodle.pro >> app/proguard-rules.pro
          if [ -n "$KEY_PASS" ] && [ -f ../doodle.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../doodle.jks.enc -out "$RUNNER_TEMP/doodle.jks" -pass env:KEY_PASS
            KS="$RUNNER_TEMP/doodle.jks"; KA=doodle; KP="$KEY_PASS"; echo "signing: release key"
          else
            KS="$HOME/.android/debug.keystore"; KA=androiddebugkey; KP=android; echo "signing: same key as before"
          fi
          { echo "android.injected.signing.store.file=$KS"; echo "android.injected.signing.store.password=$KP"
            echo "android.injected.signing.key.alias=$KA"; echo "android.injected.signing.key.password=$KP"; } >> gradle.properties
          if ! ./gradlew assembleRelease --no-daemon; then
            echo "minify failed, retrying without it"
            sed -i 's/minifyEnabled true/minifyEnabled false/; s/shrinkResources true/shrinkResources false/' app/build.gradle
            ./gradlew assembleRelease --no-daemon
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Doodle.apk
          ls -l ../Doodle.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: Doodle ${{ env.VER }}
          body_path: release-notes.md
          files: Doodle.apk
          make_latest: true
      - name: Site
        env:
          T: ${{ github.token }}
        run: |
          MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s Doodle.apk)/1048576}")
          pip install -q qrcode || true
          python3 -c "import qrcode,qrcode.image.svg as s;qrcode.make('https://dlsdml99-create.github.io/doodle/dl.html',image_factory=s.SvgPathImage,border=1).save('site/qr.svg')" || true
          sed -i "s/__VER__/$VER/g; s/__MB__/$MB/g" site/*.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://github.com/dlsdml99-create/doodle/releases/latest/download/Doodle.apk"><title>Doodle 받기</title><a href="https://github.com/dlsdml99-create/doodle/releases/latest/download/Doodle.apk">Doodle.apk 받기</a>' > site/dl.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Error
        if: failure()
        env:
          T: ${{ github.token }}
        run: |
          [ -f /tmp/build.log ] || echo "SETUP STEP FAILED" > /tmp/build.log
          echo "::error title=ERROR::$(grep -v '^+' /tmp/build.log | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          mkdir /tmp/lg && cp /tmp/build.log /tmp/lg/ && cd /tmp/lg
          git init -q -b build-log && git add . && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -qf https://x-access-token:$T@github.com/${{ github.repository }} build-log
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
