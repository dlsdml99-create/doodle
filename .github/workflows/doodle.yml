name: Build Doodle APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 1. Arrange files
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "### 1. Arrange files"
          shopt -s nullglob dotglob
          for z in *.zip; do unzip -o -q "$z" -d . ; done
          # 파일이 폴더 안에 들어가 있으면 저장소 맨 바깥으로 꺼내서 정리 (한 번만)
          if [ ! -f package.json ]; then
            SRC=$(dirname "$(find . -maxdepth 4 -name package.json -not -path './node_modules/*' -not -path './.git/*' | head -1)")
            if [ -n "$SRC" ] && [ "$SRC" != "." ]; then
              for f in "$SRC"/*; do
                case "$f" in *.yml|*.yaml) continue;; esac
                [ -e "$(basename "$f")" ] || git mv "$f" .
              done
              git config user.name "doodle-bot"; git config user.email "doodle-bot@users.noreply.github.com"
              git commit -qm "파일 정리 [skip ci]" && git push -q origin HEAD:main || true
            fi
          fi
          if [ ! -f package.json ] || [ ! -f index.html -a ! -f www/index.html ]; then
            echo "::error::앱 파일을 찾지 못했어요. Doodle-upload.zip 압축을 푼 파일들을 저장소 맨 바깥에 올려 주세요."
            ls -la; exit 1
          fi
          if [ -f index.html ]; then mkdir -p www && cp index.html www/ && cp icon-*.png www/ 2>/dev/null || true; fi
          mkdir -p icons scripts
          cp ic_launcher*.png icons/ 2>/dev/null || true
          cp splash.png icons/ 2>/dev/null || true
          [ -f apply-icons.sh ] && cp apply-icons.sh scripts/ || true
          [ -f release-notes.md ] || echo "Doodle 새 버전" > release-notes.md
          ls -la

      - name: 2. Install
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "### 2. Install"
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: 3. Create Android project
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "### 3. Create Android project"
          npx cap add android
          bash scripts/apply-icons.sh
          npx cap sync android

      - name: 4. Set version
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "### 4. Set version"
          VER=$(grep -oE 'class="ver">v[0-9.]+' www/index.html | grep -oE 'v[0-9.]+' | head -1)
          [ -n "$VER" ] || VER=v1.0
          echo "VER=$VER" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER#v}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 5. Build APK
        working-directory: android
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "### 5. Build APK"
          chmod +x gradlew
          # 항상 같은 서명 키를 써서 새 버전이 기존 앱 위에 덮어 설치되게 함
 %
